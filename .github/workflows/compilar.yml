name: Compilar ClipCut

on:
  workflow_dispatch:
  push:
    branches: [ "main", "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Construir APK y AAB
        run: gradle assembleDebug bundleRelease --no-daemon

      - name: Guardar APK para celular
        uses: actions/upload-artifact@v4
        with:
          name: ClipCut-Instalar-En-Celular-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Guardar AAB para Google Play
        uses: actions/upload-artifact@v4
        with:
          name: ClipCut-Subir-A-GooglePlay-AAB
          path: app/build/outputs/bundle/release/*.aab
