<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClipCut - Editor de Videos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background: linear-gradient(180deg, #C79500 0%, #E5B000 40%, #F7C815 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    .screen { flex: 1; display: none; flex-direction: column; overflow-y: auto; padding: 16px; padding-bottom: 80px; }
    .screen.active { display: flex; }

    #login-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
      background: linear-gradient(180deg, #C79500 0%, #F7C815 100%);
      display: flex; flex-direction: column; justify-content: space-between; padding: 24px;
    }
    .logo-box { text-align: center; margin-top: 40px; }
    .logo-c { font-size: 110px; font-weight: 900; line-height: 0.9; }
    .logo-name { font-size: 36px; font-weight: 900; }
    .login-btn {
      width: 100%; padding: 14px; border-radius: 25px; border: none; font-weight: bold;
      display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px;
      cursor: pointer; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .btn-tiktok { background: #000; color: #fff; }
    .btn-google { background: #fff; color: #000; }
    .btn-email { background: rgba(255,255,255,0.85); color: #000; }
    .btn-fb { background: #fff; color: #1877F2; }

    /* VENTANA EMERGENTE DE GOOGLE SIGN-IN */
    .google-modal-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 300; display: none;
      justify-content: center; align-items: flex-end;
    }
    .google-modal-bg.active { display: flex; }
    .google-modal {
      width: 100%; background: #fff; border-radius: 24px 24px 0 0; padding: 24px;
      color: #3c4043; animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .google-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 14px; font-weight: bold; }
    .account-item {
      display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 12px;
      cursor: pointer; transition: background 0.2s; border-bottom: 1px solid #f1f3f4;
    }
    .account-item:hover, .account-item:active { background: #f8f9fa; }
    .account-avatar {
      width: 40px; height: 40px; border-radius: 50%; background: #1a73e8; color: #fff;
      display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .pill-btn {
      background: rgba(255,255,255,0.85); padding: 6px 14px; border-radius: 20px;
      font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .pill-btn.pro-active { background: #000; color: #F7C815; }

    .main-actions { display: flex; gap: 12px; margin: 12px 0 16px; }
    .action-card {
      flex: 1; background: #FFD53D; height: 95px; border-radius: 16px; display: flex;
      flex-direction: column; justify-content: center; align-items: center; cursor: pointer;
      font-weight: bold; font-size: 14px; gap: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }

    .tools-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; text-align: center; }
    .tool-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; font-size: 11px; font-weight: 500; }
    .tool-item i { font-size: 24px; }

    .bottom-nav {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 65px;
      background: rgba(247, 200, 21, 0.95); backdrop-filter: blur(10px);
      display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(0,0,0,0.05);
    }
    .nav-tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; cursor: pointer; color: #333; }
    .nav-tab.active { color: #000; font-weight: 900; }
    .nav-tab i { font-size: 18px; }

    .paywall {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #141414;
      color: #fff; z-index: 200; display: none; flex-direction: column; padding: 20px; overflow-y: auto;
    }
    .paywall.active { display: flex; }
    .plan-card {
      background: #1E1E1E; border: 1px solid #333; border-radius: 14px; padding: 14px;
      margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .plan-card.selected { border: 2px solid #F7C815; }
    .subscribe-btn {
      background: #F7C815; color: #000; border: none; padding: 16px; border-radius: 25px;
      font-weight: 900; font-size: 15px; cursor: pointer; width: 100%; margin-top: auto;
    }

    .profile-card { background: #FFD53D; border-radius: 16px; padding: 16px; margin: 16px 0; }
    .profile-row { background: rgba(255,213,61,0.5); padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; margin-bottom: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }

    #editor-screen { background: #000; color: #fff; padding: 0; }
    .editor-header { background: #E5B000; color: #000; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .preview-box { height: 45%; display: flex; justify-content: center; align-items: center; background: #0a0a0a; position: relative; }
    .timeline { height: 35%; background: #141414; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .track { height: 34px; border-radius: 8px; display: flex; align-items: center; padding-left: 10px; font-size: 11px; font-weight: bold; }
    .track-video { background: rgba(247, 200, 21, 0.2); border: 1.5px solid #F7C815; color: #fff; }
    .track-audio { background: rgba(0, 229, 255, 0.2); border: 1.5px solid #00E5FF; color: #fff; }
    .editor-tools { height: 20%; background: #1C1C1E; display: flex; gap: 20px; overflow-x: auto; align-items: center; padding: 0 16px; }
  </style>
</head>
<body>

  <input type="file" id="file-picker" style="display: none;" accept="video/*,image/*" onchange="handleFile(event)">

  <!-- VENTANA EMERGENTE DE GOOGLE SIGN-IN -->

      <p style="font-size: 13px; color: #5f6368; margin-bottom: 16px;">Elige una cuenta para continuar</p>

      <div class="account-item" onclick="selectGoogleAccount('Teodoro Cortaza', 'teodorocortaza85@gmail.com')">

      </div>

      <!-- OTRA CUENTA / EMPRESA -->
      <div class="account-item" onclick="selectGoogleAccount('Novatri Studio Pro', 'contacto@novatristudio.com')">
        <div class="account-avatar" style="background: #E5B000; color: #000;">N</div>
        <div>
          <div style="font-weight: bold; font-size: 14px; color: #202124;">Novatri Studio (Empresa)</div>
          <div style="font-size: 12px; color: #5f6368;">contacto@novatristudio.com</div>
        </div>
      </div>

      <div style="text-align: center; margin-top: 16px;">
        <button style="border: none; background: none; color: #1a73e8; font-weight: bold; font-size: 13px; cursor: pointer;" onclick="closeGooglePopup()">Cancelar</button>
      </div>
    </div>
  </div>

    <div class="logo-box">
      <div class="logo-c">C</div>
      <div class="logo-name">ClipCut</div>
    </div>
    <div>
